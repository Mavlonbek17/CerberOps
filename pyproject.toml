[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cerberops"
version = "0.1.0"
description = "DevSecOps vulnerability orchestrator — Nmap, Nuclei, OWASP ZAP with AI-powered remediation"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Mavlonbek17" },
]
keywords = ["devsecops", "security", "vulnerability-scanner", "nmap", "nuclei", "owasp-zap", "ai", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sqlmodel>=0.0.22,<1.0",
    "sqlalchemy[asyncio]>=2.0.30,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.13.0,<2.0",
    "celery[redis]>=5.4.0,<6.0",
    "redis>=5.0.0,<6.0",
    "httpx>=0.27.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "typer>=0.12.0,<1.0",
    "rich>=13.7.0,<14.0",
    "python-multipart>=0.0.9",
    "websockets>=12.0,<14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=5.0.0,<6.0",
    "httpx>=0.27.0,<1.0",
    "ruff>=0.6.0,<1.0",
    "mypy>=1.11.0,<2.0",
]

[project.scripts]
cerberops = "cli.main:app"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "A", "C4", "SIM"]
ignore = ["S603", "S607", "S314", "B008", "S110", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
